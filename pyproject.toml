[project]
name = "audiobook"
version = "0.1.0"
description = "Turn text files into narrated audiobooks"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx",
    "python-dotenv",
    "py3langid",
    "websockets>=14",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty",
]

[build-system]
requires = ["uv_build>=0.9.27,<0.10"]
build-backend = "uv_build"

[project.scripts]
audiobook = "audiobook.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
src = ["src", "tests"]
